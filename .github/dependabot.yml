# Dependabot version updates. pip bumps are one PR per package so the automerge
# title check can read each version change.
# Auto-merge after CI: patch bumps, and minor bumps unless the current version is 0.x.
# Majors and unparseable/grouped titles stay open for review (see workflows/dependabot-auto-merge.yml).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns:
          - "*"
