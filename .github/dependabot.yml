# Dependabot version updates + grouping.
# Auto-merge after CI: patch bumps, and minor bumps unless the current version is 0.x.
# Majors and unparseable/grouped titles stay open for review (see workflows/dependabot-auto-merge.yml).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns:
          - "*"
